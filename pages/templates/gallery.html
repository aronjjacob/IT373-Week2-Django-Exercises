{% extends "base.html" %}
{% block title %}{% endblock title %}

{% block content %}
    {% load static %}
    <h1>Gallery</h1>
    <div>
        {% for img in images %}
        <figure>
            <img src="{% static "img/" %}{{ img }}" alt="{{ img }}" width='200'>
            <figcaption>{{ img  }}</figcaption>
        </figure>
        {% endfor %}
    </div>
{% endblock content %}
